<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number Converter Quest 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        dark: '#0f172a',
                        darker: '#020617',
                        card: '#1e293b',
                        bin: '#3b82f6', // Blue for Binary
                        dec: '#22c55e', // Green for Decimal
                        hex: '#a855f7', // Purple for Hex
                        warning: '#eab308',
                        byte: '#0ea5e9'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .neon-text { text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Floating Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        /* Pulse border */
        @keyframes pulse-border {
            0% { border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { border-color: rgba(59, 130, 246, 1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .pulse-active { animation: pulse-border 2s infinite; }

        /* Boss shake */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.5s; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row bg-darker overflow-hidden font-sans">
    
    <main id="app-container" class="flex-1 h-full relative flex flex-col max-w-md mx-auto w-full border-x border-slate-800 bg-dark shadow-2xl overflow-hidden z-10">
        
        <!-- Top Bar -->
        <header id="topbar" class="h-14 flex items-center justify-between px-4 bg-card border-b border-slate-700 z-20 hidden">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-sm font-bold text-byte" id="header-avatar">?</div>
                <div>
                    <div class="text-xs font-bold leading-tight" id="header-name">Player</div>
                    <div class="text-[10px] text-gray-400 font-mono" id="header-xp">0 XP</div>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="app.navigate('dashboard')" class="w-8 h-8 rounded bg-slate-800 text-gray-300 flex items-center justify-center hover:text-white transition"><i class="fa-solid fa-chart-pie"></i></button>
            </div>
        </header>

        <!-- Main Content Area -->
        <div id="view-container" class="flex-1 overflow-hidden relative">
            <!-- Templates will be injected here -->
        </div>

        <nav id="bottom-nav" class="h-16 bg-card border-t border-slate-700 flex items-center justify-around z-20 hidden pb-safe">
            <button onclick="app.navigate('home')" class="nav-btn w-12 h-12 flex flex-col items-center justify-center text-gray-500 hover:text-white transition group" data-target="home">
                <i class="fa-solid fa-house text-lg group-[.active]:text-byte group-[.active]:scale-110 transition"></i>
                <span class="text-[9px] mt-1 group-[.active]:text-white font-bold">Home</span>
            </button>
            <button onclick="app.navigate('learn')" class="nav-btn w-12 h-12 flex flex-col items-center justify-center text-gray-500 hover:text-white transition group" data-target="learn">
                <i class="fa-solid fa-book text-lg group-[.active]:text-dec group-[.active]:scale-110 transition"></i>
                <span class="text-[9px] mt-1 group-[.active]:text-white font-bold">Learn</span>
            </button>
            <button onclick="app.navigate('lab')" class="nav-btn w-12 h-12 flex flex-col items-center justify-center text-gray-500 hover:text-white transition group" data-target="lab">
                <i class="fa-solid fa-flask text-lg group-[.active]:text-warning group-[.active]:scale-110 transition"></i>
                <span class="text-[9px] mt-1 group-[.active]:text-white font-bold">Lab</span>
            </button>
            <button onclick="app.navigate('quest')" class="nav-btn w-12 h-12 flex flex-col items-center justify-center text-gray-500 hover:text-white transition group" data-target="quest">
                <div class="relative">
                    <i class="fa-solid fa-gamepad text-lg group-[.active]:text-hex group-[.active]:scale-110 transition"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full animate-ping"></span>
                </div>
                <span class="text-[9px] mt-1 group-[.active]:text-white font-bold">Quest</span>
            </button>
        </nav>
    </main>

    <!-- Custom General Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
        <div id="modal-box" class="bg-card border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl transform scale-90 transition-transform duration-300">
            <h3 id="modal-title" class="text-xl font-black mb-2 text-white">Title</h3>
            <div id="modal-body" class="text-sm text-gray-300 mb-6">Content</div>
            <div class="flex gap-3 justify-end w-full" id="modal-actions">
                <button onclick="ui.closeModal()" class="px-4 py-2 bg-slate-700 rounded-lg text-sm font-bold hover:bg-slate-600 w-full">Tutup</button>
            </div>
        </div>
    </div>

    <!-- BYTE Tutor Chat Modal -->
    <div id="byte-overlay" class="fixed inset-0 bg-black/70 z-[60] hidden flex-col items-center justify-end p-4 sm:justify-center backdrop-blur-sm">
        <div class="w-full max-w-md bg-dark border-2 border-byte rounded-3xl p-1 relative shadow-[0_0_30px_rgba(14,165,233,0.2)] animate-float mb-4">
            <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 w-24 h-24 bg-dark rounded-full border-4 border-byte flex items-center justify-center z-10 shadow-[0_0_20px_rgba(14,165,233,0.5)]">
                <div class="text-5xl">🤖</div>
            </div>
            <div class="bg-card rounded-[26px] p-6 pt-14 text-center">
                <h4 class="text-byte font-black text-xl mb-2 tracking-wide">BYTE TUTOR</h4>
                <div id="byte-message" class="text-sm text-gray-200 mb-6 min-h-[60px] font-sans leading-relaxed">Pesan dari BYTE</div>
                <div id="byte-actions" class="flex flex-col gap-2">
                    <button onclick="ui.closeByte()" class="w-full py-3 bg-byte text-dark font-black rounded-xl hover:bg-sky-400 transition">Mengerti!</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TEMPLATES -->
    
    <!-- 1. Onboarding -->
    <template id="tpl-onboarding">
        <div class="h-full flex flex-col items-center justify-center p-6 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] relative">
            <div class="absolute inset-0 bg-gradient-to-b from-darker/50 to-darker z-0"></div>
            <div class="z-10 w-full max-w-sm text-center">
                <div class="w-24 h-24 bg-card rounded-full mx-auto mb-6 flex items-center justify-center border-4 border-slate-700 shadow-xl animate-float">
                    <i class="fa-solid fa-bolt text-4xl text-warning"></i>
                </div>
                <h1 class="text-3xl font-black mb-1 neon-text bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-green-400 to-purple-400">BILANGAN BINER</h1>
                <p class="text-xs text-gray-400 mb-8 font-mono">Platform Pembelajaran Konversi Bilangan</p>
                
                <div class="bg-card p-6 rounded-2xl border border-slate-700 shadow-xl text-left">
                    <h2 class="text-lg font-bold mb-4">Registrasi Peserta Didik</h2>
                    <div class="mb-4">
                        <label class="block text-[10px] text-gray-400 font-bold mb-1 uppercase tracking-wider">Nama Siswa</label>
                        <input type="text" id="reg-name" placeholder="Contoh: Alex" class="w-full bg-dark border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-byte focus:ring-1 focus:ring-byte transition">
                    </div>
                    <div class="mb-6">
                        <label class="block text-[10px] text-gray-400 font-bold mb-1 uppercase tracking-wider">Kelas</label>
                        <select id="reg-class" class="w-full bg-dark border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-byte transition appearance-none">
                        <option value="" disabled selected>Pilih Kelas ▼</option>
                        <option value="7A">Kelas 7A</option>
                        <option value="7B">Kelas 7B</option>
                        <option value="7C">Kelas 7C</option>
                        <option value="7D">Kelas 7D</option>
                        <option value="8A">Kelas 8A</option>
                        <option value="8B">Kelas 8B</option>
                        <option value="8C">Kelas 8C</option>
                        <option value="8D">Kelas 8D</option>
                        <option value="8E">Kelas 8E</option>
                        <option value="8F">Kelas 8F</option>
                        <option value="8G">Kelas 8G</option>
                        <option value="8H">Kelas 8H</option>
                        <option value="8I">Kelas 8I</option>
                        <option value="8J">Kelas 8J</option>
                        <option value="8K">Kelas 8K</option>
                        <option value="8L">Kelas 8L</option>
                        <option value="8N">Kelas 8M</option>
                        <option value="8N">Kelas 8N</option>
                        </select>
                    </div>
                    <button onclick="app.completeOnboarding()" class="w-full bg-byte text-dark font-black py-4 rounded-xl hover:bg-sky-400 transition flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(14,165,233,0.4)]">
                        MULAI MISI <i class="fa-solid fa-rocket"></i>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- 2. Home -->
    <template id="tpl-home">
        <div class="p-5 h-full overflow-y-auto pb-24 relative">
            <!-- Hero -->
            <div class="bg-gradient-to-br from-card to-darker rounded-3xl p-6 border border-slate-700 relative overflow-hidden mb-6 shadow-xl">
                <div class="absolute -right-4 -bottom-4 text-8xl opacity-10"><i class="fa-solid fa-microchip"></i></div>
                <h2 class="text-2xl font-black mb-1">Status Sistem</h2>
                <div class="text-xs text-warning font-mono mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-warning animate-ping"></span> CORE-X TERKUNCI
                </div>
                <p class="text-sm text-gray-300 mb-6 leading-relaxed relative z-10">Kuasai bahasa Biner, Desimal, dan Heksadesimal untuk memulihkan sistem utama.</p>
                <div class="flex gap-2">
                    <button onclick="app.navigate('quest')" class="flex-1 bg-byte text-dark font-black py-3 rounded-xl shadow-[0_0_15px_rgba(14,165,233,0.3)] hover:bg-sky-400 transition transform active:scale-95">LANJUTKAN MISI</button>
                </div>
            </div>

            <!-- Dashboard Grid -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div onclick="app.navigate('learn')" class="bg-card p-4 rounded-2xl border border-slate-700 hover:border-dec cursor-pointer transition flex flex-col items-center justify-center text-center gap-2 group">
                    <div class="w-12 h-12 rounded-full bg-darker flex items-center justify-center group-hover:scale-110 transition"><i class="fa-solid fa-book text-2xl text-dec drop-shadow-[0_0_8px_rgba(34,197,94,0.4)]"></i></div>
                    <div>
                        <div class="font-bold text-sm">Akademi</div>
                        <div class="text-[9px] text-gray-500">6 Modul Belajar</div>
                    </div>
                </div>
                <div onclick="app.navigate('lab')" class="bg-card p-4 rounded-2xl border border-slate-700 hover:border-warning cursor-pointer transition flex flex-col items-center justify-center text-center gap-2 group">
                    <div class="w-12 h-12 rounded-full bg-darker flex items-center justify-center group-hover:scale-110 transition"><i class="fa-solid fa-flask text-2xl text-warning drop-shadow-[0_0_8px_rgba(234,179,8,0.4)]"></i></div>
                    <div>
                        <div class="font-bold text-sm">Lab Konversi</div>
                        <div class="text-[9px] text-gray-500">Eksplorasi Angka</div>
                    </div>
                </div>
                <div onclick="app.navigate('mistakes')" class="bg-card p-4 rounded-2xl border border-slate-700 hover:border-red-500 cursor-pointer transition flex flex-col items-center justify-center text-center gap-2 group">
                    <div class="w-12 h-12 rounded-full bg-darker flex items-center justify-center group-hover:scale-110 transition"><i class="fa-solid fa-book-skull text-2xl text-red-500 drop-shadow-[0_0_8px_rgba(239,68,68,0.4)]"></i></div>
                    <div>
                        <div class="font-bold text-sm">Buku Error</div>
                        <div class="text-[9px] text-gray-500">Analisis Kesalahan</div>
                    </div>
                </div>
                <div onclick="app.navigate('leaderboard')" class="bg-card p-4 rounded-2xl border border-slate-700 hover:border-byte cursor-pointer transition flex flex-col items-center justify-center text-center gap-2 group">
                    <div class="w-12 h-12 rounded-full bg-darker flex items-center justify-center group-hover:scale-110 transition"><i class="fa-solid fa-trophy text-2xl text-byte drop-shadow-[0_0_8px_rgba(14,165,233,0.4)]"></i></div>
                    <div>
                        <div class="font-bold text-sm">Peringkat</div>
                        <div class="text-[9px] text-gray-500">Leaderboard Global</div>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="bg-card rounded-2xl p-4 border border-slate-700">
                <div class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">Penguasaan (Mastery)</div>
                <div class="space-y-3" id="home-mastery-list">
                    <!-- Injected via JS -->
                </div>
            </div>
        </div>
    </template>

    <!-- 3. Learn List -->
    <template id="tpl-learn-list">
        <div class="p-5 h-full overflow-y-auto pb-24">
            <h2 class="text-xl font-black mb-1">Akademi Digital</h2>
            <p class="text-xs text-gray-400 mb-6 font-mono">Pahami cara praktis konversi bilangan.</p>
            <div class="space-y-4" id="learn-module-container">
                <!-- Injected via JS -->
            </div>
        </div>
    </template>

    <!-- 4. Learn Detail -->
    <template id="tpl-learn-detail">
        <div class="h-full flex flex-col bg-darker relative">
            <div class="h-14 bg-card border-b border-slate-700 flex items-center px-4 sticky top-0 z-10">
                <button onclick="app.navigate('learn')" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-white mr-2 transition"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="font-bold text-sm truncate flex-1" id="learn-d-title">Title</div>
            </div>
            <div class="flex-1 overflow-y-auto p-5 pb-24" id="learn-d-content">
                <!-- Dynamic Content -->
            </div>
        </div>
    </template>

    <!-- 5. Lab -->
    <template id="tpl-lab">
        <div class="p-5 h-full flex flex-col pb-24 overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-black"><i class="fa-solid fa-flask text-warning mr-2"></i>Lab Konversi</h2>
                <button onclick="app.showLabHelp()" class="w-8 h-8 rounded-full bg-slate-800 text-gray-400 hover:text-white transition"><i class="fa-solid fa-question"></i></button>
            </div>
            <p class="text-xs text-gray-400 mb-4 font-mono leading-relaxed">Ubah satu nilai, yang lain otomatis mengikuti. Gunakan untuk memeriksa pemahamanmu.</p>

            <div class="space-y-4 flex-none">
                <!-- BINARY -->
                <div class="bg-card border-2 border-slate-700 focus-within:border-bin rounded-xl p-4 transition-colors relative overflow-hidden group">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-bin opacity-50 group-focus-within:opacity-100 transition"></div>
                    <label class="text-xs font-bold text-bin mb-2 block uppercase tracking-wider pl-2"><i class="fa-solid fa-microchip mr-1"></i> Biner (Basis 2)</label>
                    <input type="text" id="lab-bin" placeholder="Contoh: 1010" class="w-full bg-transparent text-2xl font-mono text-white focus:outline-none pl-2" oninput="lab.onInput('bin')" autocomplete="off">
                </div>
                <!-- DECIMAL -->
                <div class="bg-card border-2 border-slate-700 focus-within:border-dec rounded-xl p-4 transition-colors relative overflow-hidden group">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-dec opacity-50 group-focus-within:opacity-100 transition"></div>
                    <label class="text-xs font-bold text-dec mb-2 block uppercase tracking-wider pl-2"><i class="fa-solid fa-hashtag mr-1"></i> Desimal (Basis 10)</label>
                    <input type="number" id="lab-dec" placeholder="Contoh: 42" class="w-full bg-transparent text-2xl font-mono text-white focus:outline-none pl-2" oninput="lab.onInput('dec')" autocomplete="off">
                </div>
                <!-- HEX -->
                <div class="bg-card border-2 border-slate-700 focus-within:border-hex rounded-xl p-4 transition-colors relative overflow-hidden group">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-hex opacity-50 group-focus-within:opacity-100 transition"></div>
                    <label class="text-xs font-bold text-hex mb-2 block uppercase tracking-wider pl-2"><i class="fa-solid fa-barcode mr-1"></i> Heksadesimal (Basis 16)</label>
                    <input type="text" id="lab-hex" placeholder="Contoh: 2A" class="w-full bg-transparent text-2xl font-mono text-white focus:outline-none uppercase pl-2" oninput="lab.onInput('hex')" autocomplete="off">
                </div>
            </div>

            <button onclick="lab.explain()" class="w-full mt-6 bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition flex items-center justify-center gap-2 flex-none shadow-lg active:scale-95">
                <i class="fa-solid fa-magnifying-glass text-warning"></i> Jelaskan Caranya (Step-by-Step)
            </button>
            
            <div id="lab-explanation" class="mt-4 hidden flex-col gap-3 pb-8">
                <!-- Explanation injected here -->
            </div>
        </div>
    </template>

    <!-- 6. Quest Map -->
    <template id="tpl-quest-map">
        <div class="h-full flex flex-col bg-darker relative">
            <div class="p-5 border-b border-slate-700 bg-card z-10 flex justify-between items-center shadow-lg">
                <div>
                    <h2 class="text-xl font-black">Quest Map</h2>
                    <p class="text-xs text-gray-400 font-mono">Level <span id="qm-current" class="text-byte font-bold">1</span> / 25</p>
                </div>
                <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center border-2 border-byte shadow-[0_0_15px_rgba(14,165,233,0.4)]">
                    <i class="fa-solid fa-robot text-byte text-xl animate-bounce" style="animation-duration: 2s;"></i>
                </div>
            </div>
            <!-- Map Container -->
            <div class="flex-1 overflow-y-auto p-6 relative pb-32" id="quest-map-container" style="scroll-behavior: smooth;">
                <!-- Vertical Line -->
                <div class="absolute left-1/2 transform -translate-x-1/2 top-10 bottom-10 w-1 bg-slate-700 z-0 rounded-full" id="qm-line"></div>
                <!-- Nodes injected via JS -->
                <div id="qm-nodes" class="relative z-10 flex flex-col gap-8 pb-10"></div>
            </div>
        </div>
    </template>

    <!-- 7. Quest Play -->
    <template id="tpl-quest-play">
        <div class="h-full flex flex-col bg-darker">
            <div class="h-14 bg-card border-b border-slate-700 flex items-center justify-between px-4 shrink-0">
                <button onclick="app.navigate('quest')" class="text-gray-400 hover:text-white p-2 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
                <div class="text-sm font-bold font-mono tracking-widest" id="qp-level-title">LEVEL 1</div>
                <button onclick="quest.reqHint()" class="text-warning hover:text-yellow-300 relative group p-2 transition"><i class="fa-solid fa-lightbulb text-lg"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full animate-ping" id="qp-hint-badge"></span>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-5 pb-24 flex flex-col" id="qp-content">
                <!-- Boss HP Bar (Hidden by default) -->
                <div id="qp-boss-bar" class="hidden w-full mb-6 bg-card p-4 rounded-2xl border border-red-900 shadow-[0_0_20px_rgba(220,38,38,0.2)]">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-black text-red-500 tracking-wider"><i class="fa-solid fa-skull mr-2"></i>THE NUMBER GLITCH</span>
                        <span class="text-xs font-mono font-bold text-red-400" id="qp-boss-hp-text">10/10 HP</span>
                    </div>
                    <div class="h-4 w-full bg-dark rounded-full overflow-hidden border border-red-900/50">
                        <div id="qp-boss-hp-fill" class="h-full bg-gradient-to-r from-red-700 to-red-400 transition-all duration-300 relative" style="width: 100%;">
                            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/diagonal-stripes.png')] opacity-30"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-card p-6 rounded-2xl border border-slate-700 shadow-xl mb-6 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-green-500 to-purple-500"></div>
                    <div class="text-xs text-gray-400 mb-4 font-mono leading-relaxed" id="qp-story">Story text here...</div>
                    <div class="bg-dark p-4 rounded-xl border border-slate-600/50 flex items-center justify-center min-h-[100px]">
                        <h3 class="text-xl font-bold font-mono text-white text-center leading-snug" id="qp-question">QUESTION</h3>
                    </div>
                </div>

                <!-- Interaction Area -->
                <div id="qp-interaction" class="flex-1 flex flex-col justify-end pb-4">
                    <!-- Dynamic Answer Area -->
                </div>
            </div>
        </div>
    </template>

    <!-- 8. Mistakes Book -->
    <template id="tpl-mistakes">
        <div class="p-5 h-full overflow-y-auto pb-24">
            <h2 class="text-xl font-black mb-1"><i class="fa-solid fa-book-skull text-red-500 mr-2"></i>Buku Kesalahan</h2>

            renderLeaderboard: async () => {

                let data = [];
                
                // 1. Tarik data dari Google Sheets jika URL tersedia
                if (SCRIPT_URL) {
                    try {
                        const response = await fetch(SCRIPT_URL);

                        if (Array.isArray(serverData) && serverData.length > 0) {
                            data = serverData;
                        } else {
                            data = [...MOCK_LEADERBOARD]; // Fallback jika DB kosong

                        console.error("Gagal menarik data dari server, menggunakan mock data lokal.", error);
                        data = [...MOCK_LEADERBOARD]; // Fallback jika gagal fetch
                    }

                    data = [...MOCK_LEADERBOARD]; // Fallback jika URL belum diisi
                }
                
                // 2. Tandai data pengguna yang sedang bermain dan pastikan XP-nya up-to-date
                const userExistsIndex = data.findIndex(d => d.name === state.user.name && d.class === state.user.class);

                    data[userExistsIndex].isUser = true;
                    // Pastikan angka lokal juga tidak lebih rendah (antisipasi jeda sinkronisasi)
                    data[userExistsIndex].xp = Math.max(data[userExistsIndex].xp, state.user.xp); 
                } else if (state.user.name) {
                    // Jika player baru dan belum masuk DB, tempel sementara di lokal view
                    const userEntry = { name: state.user.name + " (Kamu)", class: state.user.class, xp: state.user.xp, isUser: true };
                    data.push(userEntry);
                }
                
                // 3. Filter berdasarkan kelas
                if (filter !== 'all') {
                    data = data.filter(d => d.class === filter || (filter === 'other' && !['7','8','9'].includes(d.class)));
                }
                
                // 4. Sorting berdasarkan XP tertinggi
                data.sort((a, b) => b.xp - a.xp);
                
                // 5. Render Top 3 Podium

                            </div>
                        </div>
                        <div class="flex flex-col items-center w-1/3 z-10">
                            <div class="text-5xl mb-2 drop-shadow-[0_0_15px_rgba(234,179,8,0.6)] animate-pulse">👑</div>
                            <div class="bg-gradient-to-t from-warning/20 to-card w-full rounded-t-xl border-t-4 border-warning p-2 text-center h-28 flex flex-col justify-start pt-4 shadow-[0_-5px_20px_rgba(234,179,8,0.3)]">
                                <div class="text-xs font-black truncate w-full px-1 ${data[0].isUser ? 'text-warning' : 'text-white'}">${data[0].name}</div>
                                <div class="text-[11px] text-warning font-mono font-bold mt-1 bg-dark/50 rounded-full py-0.5">${data[0].xp} XP</div>
                            </div>
                        </div>
                        <div class="flex flex-col items-center w-1/3 opacity-90 relative top-6">
                            <div class="text-2xl mb-2 drop-shadow-[0_0_8px_rgba(217,119,6,0.4)]">🥉</div>
                            <div class="bg-gradient-to-t from-orange-700/20 to-card w-full rounded-t-xl border-t-4 border-orange-700 p-2 text-center h-16 flex flex-col justify-end pb-2 shadow-[0_-5px_15px_rgba(194,65,12,0.2)]">

        // --- STREAMING_CHUNK: Building Learn Engine ---

                        `<button onclick="ui.closeModal(); app.navigate('learn')" class="w-full py-4 bg-green-600 text-white font-black rounded-xl hover:bg-green-500 transition shadow-[0_0_15px_rgba(34,197,94,0.3)]">+50 XP | Kembali ke Akademi</button>`
                    );
                } else {
                    ui.showByte(`<b>Belum tepat!</b><br><br><span class="text-gray-300 block bg-dark p-3 rounded mt-2 border border-slate-700">${m.quiz.exp}</span><br>Coba ingat triknya dan ulangi.`, 
                    `<button onclick="ui.closeByte()" class="w-full py-3 bg-slate-700 text-white font-bold rounded-xl hover:bg-slate-600 transition">Coba Lagi</button>`);
                }
            }
        };

        // --- STREAMING_CHUNK: Building lab and converter engines ---
        const lab = {
            lastInput: '',
            lastType: '',
            
            onInput: (type) => {
                const val = document.getElementById(`lab-${type}`).value;
                lab.lastInput = val;
                lab.lastType = type;
                
                let dec = 0;
                try {
                    if (val === '') {
                        lab.clear(); return;
                    }
                    if (type === 'bin') {
                        if (!/^[01]+$/.test(val)) return;
                        dec = parseInt(val, 2);
                    } else if (type === 'dec') {
                        dec = parseInt(val, 10);
                    } else if (type === 'hex') {
                        if (!/^[0-9A-Fa-f]+$/.test(val)) return;
                        dec = parseInt(val, 16);
                    }
                    
                    if(isNaN(dec)) return;

                    if (type !== 'bin') document.getElementById('lab-bin').value = dec.toString(2);
                    if (type !== 'dec') document.getElementById('lab-dec').value = dec.toString(10);
                    if (type !== 'hex') document.getElementById('lab-hex').value = dec.toString(16).toUpperCase();
                } catch(e) {}
            },

                document.getElementById('lab-bin').value = '';
                document.getElementById('lab-dec').value = '';

                document.getElementById('lab-explanation').innerHTML = '';
                document.getElementById('lab-explanation').classList.add('hidden');

                container.classList.remove('hidden');
                container.classList.add('flex');
                
                const binStr = document.getElementById('lab-bin').value;
                const decStr = document.getElementById('lab-dec').value;
                const hexStr = document.getElementById('lab-hex').value;
                
                let html = '';
                
                if (lab.lastType === 'bin') {
                    html = `
                        <div class="bg-dark p-5 rounded-2xl border border-bin text-sm mb-2 shadow-lg relative overflow-hidden">
                            <div class="absolute right-0 top-0 opacity-10 text-6xl"><i class="fa-solid fa-hashtag"></i></div>
                            <div class="font-bold text-bin mb-3 border-b border-slate-700 pb-2 flex items-center"><i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Biner → Desimal (Tabel Ajaib)</div>

                            <div class="font-mono bg-card p-3 rounded-xl border border-slate-700 overflow-x-auto whitespace-nowrap mb-3 shadow-inner">

                            </div>
                            <div class="text-xs bg-slate-800 p-3 rounded-xl border border-slate-600">Jumlahkan nilai atas yang punya angka 1 di bawahnya:<br>
                            <span class="font-mono font-bold text-white mt-1 block">${binStr.split('').reverse().map((b, i) => b === '1' ? Math.pow(2,i) : 0).filter(v => v>0).reverse().join(' + ')} = <b class="text-dec text-base">${decStr}</b></span></div>
                        </div>

                            <div class="absolute right-0 top-0 opacity-10 text-6xl"><i class="fa-solid fa-barcode"></i></div>
                            <div class="font-bold text-hex mb-3 border-b border-slate-700 pb-2 flex items-center"><i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Biner → Hex (Trik 4 Bit)</div>
                            <div class="text-xs text-gray-400 mb-3 font-medium">Pecah biner menjadi kelompok 4 angka dari kanan:</div>
                            <div class="font-mono bg-card p-3 rounded-xl border border-slate-700 mb-3 break-all text-center flex justify-center flex-wrap gap-2 shadow-inner">
                                ${binStr.padStart(Math.ceil(binStr.length / 4) * 4, '0').match(/.{1,4}/g).map(g => `<span class="inline-block px-3 py-1 bg-slate-800 rounded-lg border border-slate-600 text-bin font-black tracking-widest">${g}</span>`).join('')}
                            </div>
                            <div class="text-xs bg-slate-800 p-3 rounded-xl border border-slate-600">Ubah tiap kelompok 4-bit ke Hex (pakai 8-4-2-1): <br><b class="font-mono text-hex text-lg mt-1 block tracking-widest">${hexStr}</b></div>
                        </div>
                    `;
                } else if (lab.lastType === 'dec') {
                    let d = parseInt(decStr);
                    
                    // Dec to Bin steps (Division method for simplicity)
                    let steps = [];
                    let tempD = d;
                    if(tempD === 0) steps.push(`<li class="flex justify-between py-1"><span>0 ÷ 2 = 0</span> <span class="text-bin font-bold bg-slate-800 px-2 rounded">sisa 0</span></li>`);
                    while(tempD > 0) {
                        let rem = tempD % 2;
                        let div = Math.floor(tempD / 2);
                        steps.push(`<li class="flex justify-between py-1.5 border-b border-slate-700/50 last:border-0"><span>${tempD} ÷ 2 = <b>${div}</b></span> <span class="text-bin font-bold bg-slate-800 px-2 rounded">sisa ${rem}</span></li>`);
                        tempD = div;
                    }

                    // Dec to Hex steps
                    let hSteps = [];
                    let hNum = parseInt(decStr);
                    if(hNum === 0) hSteps.push(`<li class="flex justify-between py-1"><span>0 ÷ 16 = 0</span> <span class="text-hex font-bold bg-slate-800 px-2 rounded">sisa 0</span></li>`);
                    while(hNum > 0) {
                        let rem = hNum % 16;
                        let div = Math.floor(hNum / 16);
                        let hexChar = rem.toString(16).toUpperCase();
                        hSteps.push(`<li class="flex justify-between py-1.5 border-b border-slate-700/50 last:border-0"><span>${hNum} ÷ 16 = <b>${div}</b></span> <span class="text-hex font-bold bg-slate-800 px-2 rounded">sisa ${rem} ${rem>9? `(${hexChar})`:''}</span></li>`);
                        hNum = div;
                    }

                    html = `
                        <div class="bg-dark p-5 rounded-2xl border border-bin text-sm mb-2 shadow-lg relative overflow-hidden">
                            <div class="absolute right-0 top-0 opacity-10 text-6xl"><i class="fa-solid fa-microchip"></i></div>
                            <div class="font-bold text-bin mb-3 border-b border-slate-700 pb-2 flex items-center"><i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Desimal → Biner (Bagi 2)</div>
                            <ul class="font-mono bg-card p-3 rounded-xl border border-slate-700 mb-3 max-h-40 overflow-y-auto shadow-inner text-xs">
                                ${steps.join('')}
                            </ul>
                            <div class="text-xs bg-slate-800 p-3 rounded-xl border border-slate-600">Baca sisa dari BAWAH ke ATAS:<br> <b class="font-mono text-bin text-lg tracking-widest mt-1 block">${binStr}</b></div>
                        </div>
                        <div class="bg-dark p-5 rounded-2xl border border-hex text-sm shadow-lg relative overflow-hidden">
                            <div class="absolute right-0 top-0 opacity-10 text-6xl"><i class="fa-solid fa-barcode"></i></div>
                            <div class="font-bold text-hex mb-3 border-b border-slate-700 pb-2 flex items-center"><i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Desimal → Hex (Bagi 16)</div>
                            <ul class="font-mono bg-card p-3 rounded-xl border border-slate-700 mb-3 space-y-1 text-xs shadow-inner">
                                ${hSteps.join('')}
                            </ul>
                            <div class="text-xs bg-slate-800 p-3 rounded-xl border border-slate-600">Baca sisa dari BAWAH ke ATAS:<br> <b class="font-mono text-hex text-lg tracking-widest mt-1 block">${hexStr}</b></div>
                        </div>
                    `;
                } else if (lab.lastType === 'hex') {
                    // Hex to Dec steps
                    let dSteps = [];
                    let hArr = hexStr.split('').reverse();
                    hArr.forEach((char, i) => {
                        let val = parseInt(char, 16);
                        let mult = Math.pow(16, i);
                        dSteps.push(`<li class="flex justify-between py-1.5 border-b border-slate-700/50 last:border-0"><span>Digit ${char} (${val}) &times; ${mult}</span> <b class="text-dec">${val * mult}</b></li>`);
                    });

                    // Hex to Bin steps
                    let bSteps = [];
                    hexStr.split('').forEach(char => {
                        let b = parseInt(char, 16).toString(2).padStart(4, '0');
                        bSteps.push(`<span class="inline-block text-center m-1"><div class="font-bold text-hex mb-1 border-b border-slate-600 text-lg">${char}</div><div class="bg-slate-800 border border-slate-600 rounded-lg px-2 py-1 text-bin font-black tracking-widest">${b}</div></span>`);
                    });

                    html = `
                        <div class="bg-dark p-5 rounded-2xl border border-dec text-sm mb-2 shadow-lg relative overflow-hidden">
                            <div class="absolute right-0 top-0 opacity-10 text-6xl"><i class="fa-solid fa-hashtag"></i></div>
                            <div class="font-bold text-dec mb-3 border-b border-slate-700 pb-2 flex items-center"><i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Hex → Desimal (Nilai Tempat 16)</div>
                            <div class="text-xs text-gray-400 mb-3 font-medium">Kalikan tiap digit dari kanan dengan 1, 16, 256...:</div>
                            <ul class="font-mono bg-card p-3 rounded-xl border border-slate-700 mb-3 space-y-1 text-xs shadow-inner">
                                ${dSteps.join('')}
                            </ul>
                            <div class="text-xs bg-slate-800 p-3 rounded-xl border border-slate-600">Total penjumlahan = <b class="font-mono text-dec text-lg block mt-1">${decStr}</b></div>
                        </div>
                        <div class="bg-dark p-5 rounded-2xl border border-bin text-sm shadow-lg relative overflow-hidden">
                            <div class="absolute right-0 top-0 opacity-10 text-6xl"><i class="fa-solid fa-microchip"></i></div>
                            <div class="font-bold text-bin mb-3 border-b border-slate-700 pb-2 flex items-center"><i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Hex → Biner (Pecah 4 Bit)</div>
                            <div class="text-xs text-gray-400 mb-3 font-medium">Ubah setiap digit Hex menjadi 4-bit biner:</div>
                            <div class="font-mono flex flex-wrap justify-center bg-card p-3 rounded-xl border border-slate-700 mb-3 gap-2 shadow-inner">
                                ${bSteps.join('')}
                            </div>
                            <div class="text-xs bg-slate-800 p-3 rounded-xl border border-slate-600">Gabungkan hasilnya = <b class="font-mono text-bin text-lg tracking-widest block mt-1 break-all">${binStr}</b></div>
                        </div>
                    `;
                }

                container.innerHTML = html;
                
                // Add "Show Me Why" Button
                container.innerHTML += `
                    <button onclick="ui.showByte('<b>Kenapa beda basis?</b><br><br>Manusia punya 10 jari, jadi kita pakai 10 angka (Basis 10 / Desimal).<br><br>Komputer tidak punya jari! Ia cuma pakai saklar listrik ON (1) dan OFF (0). Ini disebut Basis 2 / Biner.<br><br>Lalu kenapa ada Heksadesimal (Basis 16)? Karena deretan biner itu panjaaaaang sekali! Programmer membuat Hex untuk meringkas 4 angka Biner menjadi 1 huruf/angka saja biar mudah dibaca manusia.')" class="mt-2 text-xs font-bold text-byte bg-byte/10 border border-byte/30 py-3 rounded-xl text-center w-full hover:bg-byte/20 transition flex items-center justify-center gap-2"><i class="fa-solid fa-lightbulb"></i> Kenapa sistem bilangannya berbeda? (Show me why)</button>
                `;
            }
        };

        // --- STREAMING_CHUNK: Finalizing quest and game loop ---
        const quest = {
            activeLevel: null,
            bossHP: 10,
            
            renderMap: () => {
                app.renderTemplate('tpl-quest-map');
                document.getElementById('qm-current').innerText = state.user.level;
                
                const container = document.getElementById('qm-nodes');
                let mapHtml = '';
                
                QUEST_LEVELS.forEach((q, index) => {
                    const isUnlocked = state.user.level >= q.id;
                    const isCompleted = state.user.level > q.id;
                    const isBoss = q.id === 25;
                    
                    let bg = isCompleted ? 'bg-byte shadow-[0_0_15px_rgba(14,165,233,0.5)]' : (isUnlocked ? 'bg-warning pulse-active' : 'bg-slate-800');
                    let icon = isCompleted ? 'fa-check text-white' : (isBoss ? 'fa-skull text-white' : 'fa-lock text-gray-500');
                    if(isUnlocked && !isCompleted && !isBoss) icon = 'fa-play text-dark';
                    
                    let align = index % 2 === 0 ? 'flex-row' : 'flex-row-reverse';
                    
                    mapHtml += `
                        <div class="flex items-center justify-center gap-4 w-full ${align}">
                            <div class="w-2/5 ${index % 2 === 0 ? 'text-right' : 'text-left'} bg-dark/50 p-2 rounded-xl border border-slate-700/50 backdrop-blur-sm">
                                <div class="text-xs font-black ${isUnlocked ? 'text-white' : 'text-gray-600'} tracking-wide">${q.title}</div>
                                <div class="text-[9px] font-mono text-gray-400 mt-0.5">Level ${q.id} ${isBoss?'(BOSS)':''}</div>
                            </div>
                            <button ${isUnlocked ? `onclick="quest.play(${q.id})"` : ''} class="w-14 h-14 rounded-full flex items-center justify-center border-4 border-darker shadow-xl text-xl z-10 ${bg} transition transform ${isUnlocked ? 'hover:scale-110 active:scale-95' : 'cursor-not-allowed'}">
                                <i class="fa-solid ${icon}"></i>
                            </button>
                            <div class="w-2/5"></div>
                        </div>
                    `;
                });
                
                container.innerHTML = mapHtml;
                
                // Auto scroll
                setTimeout(() => {
                    const activeBtn = document.querySelector('.pulse-active');
                    if(activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            },
            
            play: (id) => {
                const q = QUEST_LEVELS.find(x => x.id === id);
                if(!q) return;
                quest.activeLevel = q;
                
                app.renderTemplate('tpl-quest-play');
                document.getElementById('qp-level-title').innerText = q.type === 'boss' ? 'FINAL BOSS' : `LEVEL ${q.id}`;
                document.getElementById('qp-story').innerHTML = `<i class="fa-solid fa-quote-left text-byte/50 mr-1"></i> ${q.title} <i class="fa-solid fa-quote-right text-byte/50 ml-1"></i>`;
                document.getElementById('qp-question').innerText = q.text;
                
                const interArea = document.getElementById('qp-interaction');
                
                if (q.type === 'boss') {
                    quest.bossHP = 10;
                    document.getElementById('qp-boss-bar').classList.remove('hidden');
                    quest.renderBossQuestion();
                    return;
                }

                // Render normal questions
                if(q.type === 'mcq' || q.type === 'error') {
                    interArea.innerHTML = `
                        <div class="grid grid-cols-2 gap-3 mt-4">
                            ${q.options.map(opt => `
                                <button onclick="quest.checkAnswer('${opt}')" class="bg-dark border-2 border-slate-700 hover:border-byte hover:bg-slate-800 p-5 rounded-2xl font-mono text-lg font-black transition shadow-lg active:scale-95 text-white">${opt}</button>
                            `).join('')}
                        </div>
                    `;
                } else if (q.type === 'input') {
                    interArea.innerHTML = `
                        <div class="flex flex-col items-center gap-4 mt-4 w-full">
                            <input type="text" id="qp-input" class="w-full bg-dark border-2 border-slate-600 rounded-2xl px-6 py-4 text-center text-3xl font-mono text-white focus:outline-none focus:border-byte focus:ring-4 focus:ring-byte/20 transition shadow-inner placeholder-slate-600" placeholder="Ketik jawaban..." autocomplete="off">
                            <button onclick="quest.checkAnswer(document.getElementById('qp-input').value)" class="w-full bg-byte text-dark font-black py-4 rounded-2xl shadow-[0_0_15px_rgba(14,165,233,0.4)] hover:bg-sky-400 transition active:scale-[0.98] text-lg">KONFIRMASI <i class="fa-solid fa-paper-plane ml-2"></i></button>
                        </div>
                    `;
                    // Auto focus input
                    setTimeout(() => { document.getElementById('qp-input').focus(); }, 100);
                }
            },

            renderBossQuestion: () => {
                document.getElementById('qp-boss-hp-text').innerText = `${quest.bossHP}/10 HP`;
                document.getElementById('qp-boss-hp-fill').style.width = `${(quest.bossHP/10)*100}%`;
                
                const r = Math.random();
                let ans, text, type;
                if(r < 0.33) { 
                    let val = Math.floor(Math.random() * 15) + 1; 
                    ans = val.toString();
                    text = `Glitch! Konversi biner ${val.toString(2)} ke Desimal!`;
                } else if (r < 0.66) { 
                    let val = Math.floor(Math.random() * 15) + 1;
                    ans = val.toString(16).toUpperCase();
                    text = `Serangan masuk! Ubah Desimal ${val} ke Hex!`;
                } else {
                    let val = Math.floor(Math.random() * 15) + 1;
                    ans = val.toString(2);
                    text = `Awas! Hex ${val.toString(16).toUpperCase()} jadikan Biner!`;
                }
                
                quest.activeLevel.ans = ans;
                document.getElementById('qp-question').innerText = text;
                
                document.getElementById('qp-interaction').innerHTML = `
                    <div class="flex flex-col items-center gap-4 mt-4">
                        <input type="text" id="qp-input" class="w-full bg-dark border-2 border-red-900 rounded-2xl px-6 py-4 text-center text-3xl font-mono text-white focus:outline-none focus:border-red-500 focus:ring-4 focus:ring-red-500/20 transition shadow-inner" placeholder="Tangkis serangan..." autocomplete="off">
                        <button onclick="quest.checkAnswer(document.getElementById('qp-input').value.toUpperCase())" class="w-full bg-red-600 text-white font-black py-4 rounded-2xl shadow-[0_0_15px_rgba(220,38,38,0.5)] hover:bg-red-500 transition active:scale-[0.98] text-lg"><i class="fa-solid fa-bolt mr-2"></i> SERANG BALIK!</button>
                    </div>
                `;
                setTimeout(() => { document.getElementById('qp-input').focus(); }, 100);
            },
            
            checkAnswer: (ans) => {
                const q = quest.activeLevel;
                if (!ans) return;
                
                const isCorrect = ans.trim().toUpperCase() === q.ans.toUpperCase();
                
                if (isCorrect) {
                    if (q.type === 'boss') {
                        quest.bossHP--;
                        ui.showModal(
                            '<div class="text-warning animate-pulse"><i class="fa-solid fa-bolt text-3xl mr-2"></i> CRITICAL HIT!</div>', 
                            `<div class="text-sm text-gray-200 bg-dark p-4 rounded-xl border border-warning/50">Serangan berhasil! HP Glitch berkurang.</div>`,
                            `<div class="hidden"></div>` // Hide footer buttons
                        );
                        setTimeout(() => {
                            ui.closeModal();
                            if(quest.bossHP <= 0) quest.winLevel();
                            else quest.renderBossQuestion();
                        }, 1200);
                        return;
                    }
                    
                    quest.winLevel();
                } else {
                    // Wrong Answer
                    state.mistakes.push({ lvl: q.id, type: q.type, q: q.text, userAns: ans, correctAns: q.ans });
                    storage.save();
                    
                    if (q.type === 'boss') {
                        ui.showModal(
                            '<div class="text-red-500"><i class="fa-solid fa-triangle-exclamation text-3xl mr-2"></i> SYSTEM ERROR!</div>', 
                            `<div class="text-red-400 font-bold mb-2">Serangan meleset!</div><div class="text-xs text-gray-300 bg-dark p-3 rounded-lg">Cepat ingat trik konversinya, Glitch menyerang balik!</div>`,
                            `<div class="hidden"></div>`
                        );
                        document.getElementById('qp-boss-bar').classList.add('shake');
                        setTimeout(() => { ui.closeModal(); document.getElementById('qp-boss-bar').classList.remove('shake'); }, 1500);
                        return;
                    }

                    ui.showByte(`<b>Aduh, belum tepat!</b><br><br>Kamu menjawab <b class="text-red-400 font-mono">${ans}</b>, tapi itu salah.<br><br>Sistem mencatat algoritma ini di <i>Mistake Book</i>. Jangan menyerah, coba baca <b>Hint</b> (ikon lampu di kanan atas) lalu coba lagi.`, 
                    `<div class="flex gap-2 w-full"><button onclick="ui.closeByte()" class="flex-1 py-3 bg-slate-700 text-white font-bold rounded-xl hover:bg-slate-600 transition">Coba Lagi</button><button onclick="ui.closeByte(); app.navigate('lab')" class="flex-1 py-3 bg-warning text-dark font-black rounded-xl shadow-lg">Buka Lab</button></div>`);
                }
            },
            
            winLevel: () => {
                const q = quest.activeLevel;
                if (state.user.level === q.id) {
                    state.user.level++;
                }
                const xpGained = q.type === 'boss' ? 500 : 100;
                state.user.xp += xpGained;
                
                // Update mastery randomly to simulate progress
                state.user.mastery.bin2dec = Math.min(100, state.user.mastery.bin2dec + 4);
                state.user.mastery.bin2hex = Math.min(100, state.user.mastery.bin2hex + 2);
                state.user.mastery.dec2hex = Math.min(100, state.user.mastery.dec2hex + 3);
                
                storage.save();

                if (q.type === 'boss') {
                    ui.showModal(
                        '<div class="text-byte font-black tracking-widest"><i class="fa-solid fa-globe"></i> CORE-X RESTORED!</div>', 
                        `
                        <div class="text-center">
                            <div class="text-6xl mb-4 animate-bounce mt-4 drop-shadow-[0_0_20px_rgba(234,179,8,0.6)]">🏆</div>
                            <div class="text-sm text-gray-200 mb-4 font-mono leading-relaxed bg-dark/80 p-4 rounded-xl border border-byte/50 shadow-inner">Sistem berhasil dipulihkan secara penuh!<br><br>Kamu telah menyelesaikan misi utama dan dianugerahi gelar <b>NUMBER MASTER</b>.</div>
                            <div class="text-warning font-black mt-2 text-3xl drop-shadow-[0_0_15px_rgba(234,179,8,0.5)] bg-warning/10 inline-block px-6 py-2 rounded-full border border-warning/30">+${xpGained} XP</div>
                        </div>
                        `,
                        `<button onclick="ui.closeModal(); app.navigate('leaderboard'); ui.showByte('<b>Luar Biasa, Master!</b><br><br>CORE-X kembali normal berkat bantuanmu. Mari kita lihat posisi peringkat globalmu di Leaderboard!');" class="w-full py-4 bg-byte text-dark font-black rounded-xl hover:bg-sky-400 transition shadow-[0_0_15px_rgba(14,165,233,0.4)] text-lg">Lihat Leaderboard <i class="fa-solid fa-arrow-right ml-2"></i></button>`
                    );
                } else {
                    ui.showModal(
                        '<div class="text-green-400 font-black"><i class="fa-solid fa-unlock-keyhole mr-2"></i> LEVEL CLEARED</div>', 
                        `<div class="flex flex-col items-center justify-center py-4"><div class="text-5xl mb-4 text-warning drop-shadow-[0_0_15px_rgba(234,179,8,0.4)]">⚡</div><div class="text-warning font-black text-2xl bg-dark px-6 py-2 rounded-full border border-slate-700 shadow-inner">+${xpGained} XP</div></div>`,
                        `<button onclick="ui.closeModal(); app.navigate('quest');" class="w-full py-4 bg-green-600 text-white font-black rounded-xl hover:bg-green-500 transition shadow-[0_0_15px_rgba(34,197,94,0.3)] text-lg">Lanjut <i class="fa-solid fa-forward ml-2"></i></button>`
                    );
                }
            },
            
            reqHint: () => {
                const h = quest.activeLevel.hint || "Ingat kembali materi di Akademi Digital.";
                ui.showByte(`<b>Petunjuk BYTE:</b><br><br><span class="text-white block bg-dark p-3 rounded-lg border border-slate-700/50 mt-2 text-sm leading-relaxed">${h}</span>`, `
                    <div class="flex gap-2">
                        <button onclick="ui.closeByte()" class="flex-1 py-3 bg-slate-700 text-white rounded-xl text-sm font-bold transition hover:bg-slate-600">Tutup Hint</button>
                        <button onclick="ui.closeByte(); app.navigate('lab')" class="flex-1 py-3 bg-warning text-dark rounded-xl text-sm font-black transition shadow-lg hover:bg-yellow-400"><i class="fa-solid fa-flask mr-1"></i> Buka Lab</button>
                    </div>
                `);
            }
        };

        // --- Init ---
        window.onload = app.init;
    </script>
</body>
</html>
